version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      javascript:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /tooling/otel-runtime
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      runtime:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
