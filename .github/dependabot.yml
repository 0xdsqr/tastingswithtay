version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docker/runtime
    schedule:
      interval: weekly
    groups:
      runtime:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /apps/admin
      - /apps/web
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
