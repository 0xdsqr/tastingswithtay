name: Check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install dependencies
        run: nix develop -c bun install --frozen-lockfile

      - name: Format check
        run: nix develop -c bun run format:check

      - name: Lint
        run: nix develop -c bun run lint

      - name: Build workspace packages
        run: |
          nix develop -c bun run --filter '@twt/database' build
          nix develop -c bun run --filter '@twt/core' build

      - name: Typecheck
        run: nix develop -c bun run typecheck

      - name: Build apps
        run: nix develop -c bun run --filter './apps/*' build

  helm:
    name: Helm chart check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Lint and render Helm charts
        run: nix build .#checks.x86_64-linux.helm
