name: Check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Flake checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3

      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      # Formatting, lint, typecheck, tests, unused-dependency check, both app
      # builds, Helm rendering, and workflow linting.
      - name: Run flake checks
        run: nix flake check --print-build-logs

      # Advisory lookups need the network, so they run outside the Nix sandbox.
      - name: Audit dependencies
        run: |
          nix develop --command bun audit --audit-level=high
          cd tooling/otel-runtime
          nix develop ../.. --command bun audit --audit-level=high

  image:
    name: Publish ${{ matrix.app }} image (${{ matrix.arch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tastingswithtay-${{ matrix.app }}
      REGISTRY_USERNAME: ${{ github.repository_owner }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3

      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Build image
        run: nix build ".#${{ matrix.app }}-image" --print-build-logs --out-link image-stream

      - name: Scan image for fixable vulnerabilities
        shell: nix develop .#ci --command bash -euo pipefail {0}
        run: |
          ./image-stream >image.tar
          trivy image \
            --input image.tar \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

      - name: Push image
        shell: nix develop .#ci --command bash -euo pipefail {0}
        run: |
          skopeo copy \
            --dest-creds "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
            docker-archive:image.tar \
            "docker://${IMAGE}:sha-${GITHUB_SHA}-${{ matrix.arch }}"

  manifest:
    name: Publish ${{ matrix.app }} manifest
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tastingswithtay-${{ matrix.app }}
      REGISTRY_USERNAME: ${{ github.repository_owner }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3

      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Publish multi-architecture manifest
        id: manifest
        shell: nix develop .#ci --command bash -euo pipefail {0}
        run: |
          tag="sha-${GITHUB_SHA}"
          printf '%s' "$REGISTRY_PASSWORD" \
            | regctl registry login ghcr.io --user "$REGISTRY_USERNAME" --pass-stdin
          regctl index create "$IMAGE:$tag" \
            --ref "$IMAGE:$tag-amd64" \
            --ref "$IMAGE:$tag-arm64"
          printf 'digest=%s\n' "$(regctl image digest "$IMAGE:$tag")" >>"$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
