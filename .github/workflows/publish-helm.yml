name: Publish Helm Charts

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-helm.yml"
      - "helm/**"
      - "nix/checks/helm.nix"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: Publish twt-app
    runs-on: ubuntu-24.04
    env:
      CHART_VERSION: 0.1.${{ github.run_number }}-r${{ github.run_attempt }}
      HELM_REGISTRY_REPOSITORY: oci://ghcr.io/${{ github.repository }}/charts
      REGISTRY_USERNAME: ${{ github.repository_owner }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3

      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Lint and render chart
        run: nix build .#checks.x86_64-linux.helm --print-build-logs

      - name: Publish chart
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" \
            | helm registry login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
          package_dir="$(mktemp -d)"
          helm package ./helm/twt-app --version "$CHART_VERSION" --destination "$package_dir"
          helm push "$package_dir/twt-app-$CHART_VERSION.tgz" "$HELM_REGISTRY_REPOSITORY"
