name: Publish App Images

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-web-image.yml"
      - "apps/**"
      - "packages/**"
      - "tooling/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-app-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-web-image:
    name: publish web image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tastingswithtay-web:latest
            ghcr.io/${{ github.repository_owner }}/tastingswithtay-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=web

  publish-admin-image:
    name: publish admin image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tastingswithtay-admin:latest
            ghcr.io/${{ github.repository_owner }}/tastingswithtay-admin:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=admin

  stamp-chart-tags:
    name: stamp chart tags
    runs-on: ubuntu-latest
    needs:
      - publish-web-image
      - publish-admin-image

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Stamp immutable image tags
        run: nix run .#stampChartTags -- --tag sha-${{ github.sha }} all

      - name: Render Helm charts
        run: nix build .#checks.x86_64-linux.helm

      - name: Commit chart tag update
        run: |
          if git diff --quiet; then
            echo "Helm values already point at sha-${{ github.sha }}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/tastingswithtay-web/Chart.yaml helm/tastingswithtay-web/values-prod.yaml
          git add helm/tastingswithtay-admin/Chart.yaml helm/tastingswithtay-admin/values-prod.yaml
          git commit -m "chore(gitops): pin twt images to sha-${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}
