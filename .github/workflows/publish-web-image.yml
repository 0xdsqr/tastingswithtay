name: Publish App Artifacts

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app_name: web
            dockerfile: apps/web/Dockerfile
            image_name: tastingswithtay-web
          - app_name: admin
            dockerfile: apps/admin/Dockerfile
            image_name: tastingswithtay-admin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app_name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ matrix.app_name }}

  publish-charts:
    runs-on: ubuntu-latest
    env:
      CHART_VERSION: 0.1.${{ github.run_number }}-r${{ github.run_attempt }}
    strategy:
      matrix:
        include:
          - chart_name: tastingswithtay-web
            chart_dir: ./helm/tastingswithtay-web
            release_name: twt-web
          - chart_name: tastingswithtay-admin
            chart_dir: ./helm/tastingswithtay-admin
            release_name: twt-admin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint ${{ matrix.chart_name }} chart
        run: helm lint ${{ matrix.chart_dir }}

      - name: Render ${{ matrix.chart_name }} chart
        run: |
          helm template ${{ matrix.release_name }} ${{ matrix.chart_dir }} \
            --namespace twt \
            -f ${{ matrix.chart_dir }}/values-prod.yaml

      - name: Log in to GitHub Container Registry for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.repository_owner }}" \
            --password-stdin

      - name: Package ${{ matrix.chart_name }} chart
        run: |
          helm package ${{ matrix.chart_dir }} \
            --version "${CHART_VERSION}" \
            --app-version "sha-${{ github.sha }}"

      - name: Push ${{ matrix.chart_name }} chart to GHCR
        run: helm push ${{ matrix.chart_name }}-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
