name: Publish App Artifacts

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-app-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-web-image:
    name: publish web image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tastingswithtay-web:latest
            ghcr.io/${{ github.repository_owner }}/tastingswithtay-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=web

  publish-admin-image:
    name: publish admin image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tastingswithtay-admin:latest
            ghcr.io/${{ github.repository_owner }}/tastingswithtay-admin:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=admin

  publish-web-chart:
    name: publish web chart
    runs-on: ubuntu-latest
    env:
      CHART_VERSION: 0.1.${{ github.run_number }}-r${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint web chart
        run: helm lint ./helm/tastingswithtay-web

      - name: Render web chart
        run: |
          helm template twt-web ./helm/tastingswithtay-web \
            --namespace twt \
            -f ./helm/tastingswithtay-web/values-prod.yaml

      - name: Log in to GitHub Container Registry for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.repository_owner }}" \
            --password-stdin

      - name: Package web chart
        run: |
          helm package ./helm/tastingswithtay-web \
            --version "${CHART_VERSION}" \
            --app-version "sha-${{ github.sha }}"

      - name: Push web chart to GHCR
        run: helm push tastingswithtay-web-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  publish-admin-chart:
    name: publish admin chart
    runs-on: ubuntu-latest
    env:
      CHART_VERSION: 0.1.${{ github.run_number }}-r${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint admin chart
        run: helm lint ./helm/tastingswithtay-admin

      - name: Render admin chart
        run: |
          helm template twt-admin ./helm/tastingswithtay-admin \
            --namespace twt \
            -f ./helm/tastingswithtay-admin/values-prod.yaml

      - name: Log in to GitHub Container Registry for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.repository_owner }}" \
            --password-stdin

      - name: Package admin chart
        run: |
          helm package ./helm/tastingswithtay-admin \
            --version "${CHART_VERSION}" \
            --app-version "sha-${{ github.sha }}"

      - name: Push admin chart to GHCR
        run: helm push tastingswithtay-admin-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  required:
    name: all required checks passed
    needs:
      - publish-web-image
      - publish-admin-image
      - publish-web-chart
      - publish-admin-chart
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: verify all jobs passed
        env:
          PUBLISH_WEB_IMAGE_RESULT: ${{ needs.publish-web-image.result }}
          PUBLISH_ADMIN_IMAGE_RESULT: ${{ needs.publish-admin-image.result }}
          PUBLISH_WEB_CHART_RESULT: ${{ needs.publish-web-chart.result }}
          PUBLISH_ADMIN_CHART_RESULT: ${{ needs.publish-admin-chart.result }}
        run: |
          if [ "$PUBLISH_WEB_IMAGE_RESULT" != "success" ] || \
             [ "$PUBLISH_ADMIN_IMAGE_RESULT" != "success" ] || \
             [ "$PUBLISH_WEB_CHART_RESULT" != "success" ] || \
             [ "$PUBLISH_ADMIN_CHART_RESULT" != "success" ]; then
            echo "required jobs failed:"
            echo "  publish-web-image: $PUBLISH_WEB_IMAGE_RESULT"
            echo "  publish-admin-image: $PUBLISH_ADMIN_IMAGE_RESULT"
            echo "  publish-web-chart: $PUBLISH_WEB_CHART_RESULT"
            echo "  publish-admin-chart: $PUBLISH_ADMIN_CHART_RESULT"
            exit 1
          fi
          echo "all required jobs passed"
