replicaCount: 1

image:
  repository: ghcr.io/0xdsqr/tastingswithtay-admin
  tag: sha-8048e9bf27952050ff7fd6f3c97782e5ef33f95d
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-creds

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: http
  containerPort: 3011

env:
  BASE_URL: https://admin.tastingswithtay.com
  BETTER_AUTH_URL: https://admin.tastingswithtay.com
  CDN_BASE: https://cdn.dsqr.dev
  DISCORD_CLIENT_ID: "1465977766485688370"
  S3_BUCKET: tastingswithtay
  S3_ENDPOINT: s3.dsqr.dev
  S3_FORCE_PATH_STYLE: "true"
  S3_REGION: us-east-1
  S3_USE_SSL: "true"
  TRUSTED_ORIGINS: https://admin.tastingswithtay.com,https://tastingswithtay.com
  TRUST_PROXY_HEADERS: "true"
  DATABASE_APPLICATION_NAME: twt-admin
  DATABASE_CONNECTION_TIMEOUT_MS: "5000"
  DATABASE_QUERY_TIMEOUT_MS: "15000"
  DATABASE_STATEMENT_TIMEOUT_MS: "15000"
  OTEL_SERVICE_NAME: twt-admin
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev,k8s.namespace.name=twt

existingSecret: twt-secrets

networkPolicy:
  enabled: true
  ingress:
    # Empty `from` means "allow any source to the service port".
    # Prod values should narrow this to Traefik plus trusted same-namespace apps.
    from: []
  egress:
    allowAll: false
    dns:
      enabled: true
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    extra:
      - ports:
          - protocol: TCP
            port: 443
          - protocol: TCP
            port: 5432
          - protocol: TCP
            port: 4318

resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 2Gi

startupProbe:
  httpGet:
    path: /api/health
    port: http
  periodSeconds: 5
  failureThreshold: 24

readinessProbe:
  httpGet:
    path: /api/ready
    port: http
  periodSeconds: 5
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  periodSeconds: 15
  failureThreshold: 3

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: admin.tastingswithtay.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
