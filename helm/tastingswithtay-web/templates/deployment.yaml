apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tastingswithtay-web.fullname" . }}
  labels:
    {{- include "tastingswithtay-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      {{- include "tastingswithtay-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tastingswithtay-web.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tastingswithtay-web.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "tastingswithtay-web.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          {{- if .Values.additionalTrustedCa.enabled }}
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: {{ .Values.additionalTrustedCa.mountPath | quote }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "tastingswithtay-web.fullname" . }}-config
            - secretRef:
                name: {{ .Values.existingSecret }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.additionalTrustedCa.enabled }}
            - name: additional-trusted-ca
              mountPath: {{ .Values.additionalTrustedCa.mountPath | quote }}
              subPath: {{ .Values.additionalTrustedCa.key | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- if .Values.additionalTrustedCa.enabled }}
        - name: additional-trusted-ca
          configMap:
            name: {{ required "additionalTrustedCa.configMapName is required when additionalTrustedCa.enabled is true" .Values.additionalTrustedCa.configMapName }}
            defaultMode: 0444
            items:
              - key: {{ .Values.additionalTrustedCa.key | quote }}
                path: {{ .Values.additionalTrustedCa.key | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
