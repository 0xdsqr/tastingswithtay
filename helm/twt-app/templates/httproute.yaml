{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "twt-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.parentRef.name | quote }}
      namespace: {{ .Values.route.parentRef.namespace | quote }}
      sectionName: {{ .Values.route.parentRef.sectionName | quote }}
  hostnames:
    {{- toYaml .Values.route.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}
          port: 80
{{- end }}
